  <meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Online Teleprompter">
  <meta property="og:title" content="Free Online Teleprompter — scrolls at your speaking pace">
  <meta property="og:description" content="Paste your script, press Start, read from one line. Paced in words per minute. Free, open source, runs in your browser.">

    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Online Teleprompter",
    "alternateName": ["Free Online Teleprompter", "在线提词器"],
    "url": "https://free-teleprompter.vercel.app/",
    "description": "A free, open-source online teleprompter that scrolls at your speaking pace, measured in words per minute (characters per minute for Chinese, Japanese and Korean). Scripts stay in the browser.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any modern web browser",
    "browserRequirements": "Requires JavaScript",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

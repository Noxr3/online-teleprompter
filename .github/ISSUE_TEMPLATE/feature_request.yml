name: Feature idea
description: Suggest something that would help you give a better talk.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
